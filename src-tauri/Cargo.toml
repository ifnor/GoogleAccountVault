[package]
name = "google-account-vault"
version = "3.0.7"
description = "Google Account Vault - Modern Native Password & 2FA Manager"
authors = ["Google Account Vault Team"]
license = "MIT"
edition = "2024"

[lib]
name = "google_account_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
totp-rs = { version = "5.6", features = ["qr", "serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base32 = "0.5"
dirs = "6.0"
parking_lot = "0.12"
thiserror = "2.0"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Foundation",
    "Win32_UI_WindowsAndMessaging"
] }
windows-future = "0.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
