<!doctype html>
<html lang="zh-CN" style="width:100%;height:100%;margin:0;padding:0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google 账号管家</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="color:#d93025;padding:30px;font-family:sans-serif;background:#fff;height:100vh;">' +
          '<h2 style="margin-top:0;">界面启动脚本错误</h2>' +
          '<div style="font-size:14px;background:#fce8e6;padding:15px;border-radius:8px;font-family:monospace;white-space:pre-wrap;">' +
          msg + '\n在 ' + url + ':' + line + ':' + col + '\n' + (error ? (error.stack || '') : '') +
          '</div></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:#d93025;padding:30px;font-family:sans-serif;background:#fff;height:100vh;">' +
          '<h2 style="margin-top:0;">异步调用错误 (Unhandled Promise)</h2>' +
          '<div style="font-size:14px;background:#fce8e6;padding:15px;border-radius:8px;font-family:monospace;white-space:pre-wrap;">' +
          event.reason + '\n' + (event.reason ? (event.reason.stack || '') : '') +
          '</div></div>';
      });
    </script>
  </head>

  <body style="width:100%;height:100%;margin:0;padding:0;background-color:#f8fafd;">
    <div id="app" style="width:100%;height:100%;"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
