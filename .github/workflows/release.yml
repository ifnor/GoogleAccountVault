name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（例如 v3.0.0，为空则自动读取）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop
        run: npx tauri build

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts"
          # Copy NSIS setup installer
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName -Destination "artifacts/GoogleAccountVault_Setup.exe"
          }
          # Copy standalone portable executable
          $portable = "src-tauri/target/release/google-account-vault.exe"
          if (Test-Path $portable) {
            Copy-Item $portable -Destination "artifacts/GoogleAccountVault_Portable.exe"
          }

      - name: Sign Windows executables (Authenticode)
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          Write-Host "Found signtool at: $signtool"
          $cert = "src-tauri/certs/ifnor.pfx"
          if (Test-Path $cert) {
            if (Test-Path "artifacts/GoogleAccountVault_Setup.exe") {
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p ifnor2026 "artifacts/GoogleAccountVault_Setup.exe"
            }
            if (Test-Path "artifacts/GoogleAccountVault_Portable.exe") {
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p ifnor2026 "artifacts/GoogleAccountVault_Portable.exe"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*
          retention-days: 1

  build-android:
    name: Build Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Set NDK Environment
        run: |
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Make Gradle Wrapper Executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Android APK
        run: npx tauri android build --apk -t aarch64

      - name: Prepare Android artifact
        run: |
          mkdir -p artifacts
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" artifacts/GoogleAccountVault.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: artifacts/*
          retention-days: 1

  publish-release:
    name: Create & Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename assets with version tag & Generate Checksums
        run: |
          cd release-assets
          TAG="${{ steps.tag.outputs.RELEASE_TAG }}"
          [ -f "GoogleAccountVault_Setup.exe" ] && mv "GoogleAccountVault_Setup.exe" "GoogleAccountVault_${TAG}_Setup.exe"
          [ -f "GoogleAccountVault_Portable.exe" ] && mv "GoogleAccountVault_Portable.exe" "GoogleAccountVault_${TAG}_Portable.exe"
          [ -f "GoogleAccountVault.apk" ] && mv "GoogleAccountVault.apk" "GoogleAccountVault_${TAG}.apk"
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: "Google 账号管家 ${{ steps.tag.outputs.RELEASE_TAG }}"
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
